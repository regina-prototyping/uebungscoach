<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Einstellungen</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#921A5B}a:hover{color:#6E1344}
</style>
</head>
<body style="display:flex;justify-content:center;padding:24px;background:#eee">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; background: var(--ground-wash); color: var(--ink); font-family: var(--font-sans)">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800">Einstellungen</h1>
    <button style="height: 44px; padding: 0 18px; border-radius: var(--radius-pill); border: 0; background: var(--surface); box-shadow: var(--shadow-soft); font: inherit; font-weight: 700; color: var(--ink)">Fertig</button>
  </div>

  <section style="background: var(--surface); box-shadow: var(--shadow-soft); border-radius: var(--radius-lg); padding: 4px 20px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0">
      <label style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Tempo</span><span style="font-size: 14px; color: var(--muted)">Sekunden pro Wiederholung</span></label>
      <button aria-label="Tempo verringern" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">−</button>
      <span style="width: 32px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">3</span>
      <button aria-label="Tempo erhöhen" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line)">
      <label style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Vorbereitung</span><span style="font-size: 14px; color: var(--muted)">Sekunden vor jeder Übung</span></label>
      <button aria-label="Vorbereitung verringern" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">−</button>
      <span style="width: 32px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">5</span>
      <button aria-label="Vorbereitung erhöhen" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line)">
      <label style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Satzpause</span><span style="font-size: 14px; color: var(--muted)">Sekunden zwischen zwei Sätzen</span></label>
      <button aria-label="Satzpause verringern" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">−</button>
      <span style="width: 32px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">30</span>
      <button aria-label="Satzpause erhöhen" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line)">
      <label style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Absenken</span><span style="font-size: 14px; color: var(--muted)">Sekunden zwischen Haltephasen</span></label>
      <button aria-label="Absenken verringern" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">−</button>
      <span style="width: 32px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">3</span>
      <button aria-label="Absenken erhöhen" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--tint); font: inherit; font-size: 22px; color: var(--ink)">+</button>
    </div>
  </section>

  <p style="margin: 0; font-size: 14px; color: var(--muted)">Gilt für alle Übungen, außer eine Übung hat einen eigenen Wert.</p>

  <button style="height: 56px; border-radius: var(--radius-pill); border: 0; background: var(--primary-soft); color: var(--ink); font: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>Stimme testen
  </button>
</div>
</body>
</html>
