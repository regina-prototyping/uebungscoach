<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Programm bearbeiten</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="bausteine.css">
</head>
<body>
<div class="frame">
  <div class="kopf">
    <h1 class="titel">Programm</h1>
    <button class="pill">Fertig</button>
  </div>
  <section class="card zeilen">
    <label class="feld"><span class="feld-label">Name</span><input class="eingabe" value="Rücken"></label>
    <label class="feld"><span class="feld-label">Startposition <span class="muted" style="font-weight: 600">· optional</span></span><input class="eingabe" value="Auf dem Rücken liegen"></label>
  </section>
  <h2 class="abschnitt">Übungen · 3</h2>
  <section class="card zeilen">
      <div class="zeile">
        <div class="zeile-text"><span class="zeile-name">Becken kippen</span><span class="klein muted zahl">2 × 15</span></div>
        <button class="rund" aria-label="Nach oben" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></button>
        <button class="rund" aria-label="Nach unten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="rund" aria-label="Aus Programm entfernen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
      </div>
      <div class="zeile">
        <div class="zeile-text"><span class="zeile-name">Brücke</span><span class="klein muted zahl">2 × 10 × 5 s</span></div>
        <button class="rund" aria-label="Nach oben"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></button>
        <button class="rund" aria-label="Nach unten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="rund" aria-label="Aus Programm entfernen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
      </div>
      <div class="zeile">
        <div class="zeile-text"><span class="zeile-name">Dehnung Rücken</span><span class="klein muted zahl">1 × 20 s</span></div>
        <button class="rund" aria-label="Nach oben"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></button>
        <button class="rund" aria-label="Nach unten" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="rund" aria-label="Aus Programm entfernen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
      </div>
  </section>
  <button class="btn-soft"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Übung hinzufügen</button>
  <button class="text-btn" style="align-self: center">Programm löschen</button>
  <div class="leiste"><span>„Beine seitlich kippen“ entfernt</span><button>Rückgängig</button></div>
</div>
</body>
</html>
