<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Menü</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="bausteine.css">
</head>
<body>
<div class="frame">
  <div class="kopf">
    <span class="app-name">Übungscoach</span>
    <button class="icon-btn" aria-label="Menü"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
  </div>
  <h1 class="display">Was trainierst du heute?</h1>

  <article class="card" style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
    <div style="padding: 18px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
        <h2 style="margin: 0; font-size: 24px; line-height: 28px; font-weight: 800">Rücken</h2>
        <button style="height: 44px; margin-right: -4px; padding: 0 4px; border: 0; background: none; color: var(--primary); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>Bearbeiten</button>
      </div>
      <span style="font-size: 15px" class="muted">3 Übungen · ca. 8 Min · Start: Auf dem Rücken liegen</span>
    </div>
    <div style="display: flex; flex-direction: column; padding: 4px 12px">
      <div style="display: flex; justify-content: space-between; padding: 11px 0"><span style="font-weight: 600">Becken kippen</span><span class="zahl muted">2 × 15</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-weight: 600">Beine seitlich kippen</span><span class="zahl muted">2 × 5 je Seite</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-weight: 600">Brücke</span><span class="zahl muted">2 × 10 × 5 s</span></div>
    </div>
    <button class="btn-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"></path></svg>Training starten</button>
  </article>
  <article class="card" style="padding: 18px 20px; display: flex; align-items: center; gap: 14px">
    <span style="flex: none; width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--tint); display: flex; align-items: center; justify-content: center" class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></span>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-weight: 700; font-size: 18px">Arme mit Theraband</span>
      <span class="klein muted">Noch keine Übungen · Tippen zum Bearbeiten</span>
    </div>
  </article>
  <button class="card" style="border: 0; padding: 18px 20px; display: flex; align-items: center; gap: 14px; text-align: left">
    <span style="flex: none; width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--primary-soft); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
    <span style="font-weight: 700; font-size: 18px">Neues Programm</span>
  </button>
  <div style="position: absolute; inset: 0; background: #22181F59"></div>
  <nav style="position: absolute; top: 0; right: 0; bottom: 0; left: 56px; background: var(--surface); border-radius: var(--radius-lg) 0 0 var(--radius-lg); box-shadow: -8px 0 32px #22181F26; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px">
    <div class="kopf">
      <span class="titel">Menü</span>
      <button class="icon-btn" aria-label="Menü schließen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column">
      <button class="zeile" style="width: 100%; border: 0; background: none; text-align: left; padding: 12px 0">
        <span style="flex: none; width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--primary-soft); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg></span>
        <span class="zeile-text"><span class="zeile-name" style="font-size: 18px">Übungen</span><span class="klein muted">Alle Übungen anlegen und bearbeiten</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left; padding: 12px 0">
        <span style="flex: none; width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--tint); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg></span>
        <span class="zeile-text"><span class="zeile-name" style="font-size: 18px">Einstellungen</span><span class="klein muted">Tempo, Pausen, Stimme</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </nav>
</div>
</body>
</html>
