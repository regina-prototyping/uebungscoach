<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Übung mit eigenen Zeiten</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="bausteine.css">
</head>
<body>
<div class="frame">
  <div class="kopf">
    <h1 class="titel">Übung</h1>
    <button class="pill">Fertig</button>
  </div>
  <section class="card zeilen">
    <label class="feld"><span class="feld-label">Name</span><input class="eingabe" value="Brücke"></label>
    <label class="feld"><span class="feld-label">Hinweis <span class="muted" style="font-weight: 600">· optional</span></span><input class="eingabe" value="Oben halten"></label>
  </section>
  <section class="card zeilen">
    <div class="feld">
      <span class="feld-label">Art</span>
      <div class="chips"><span class="chip">Wiederholungen</span><span class="chip aktiv">Halten</span></div>
    </div>
    <div class="stepper" style="padding: 14px 0">
      <div class="zeile-text"><span class="zeile-name">Pro Seite</span><span class="klein muted">Erst links, dann rechts</span></div>
      <span class="schalter"></span>
    </div>
    <div class="stepper">
      <div class="zeile-text"><span class="zeile-name">Wiederholungen</span><span class="klein muted">pro Satz</span></div>
      <button class="rund">−</button><span class="wert">10</span><button class="rund">+</button>
    </div>
    <div class="stepper">
      <div class="zeile-text"><span class="zeile-name">Haltedauer</span><span class="klein muted">Sekunden</span></div>
      <button class="rund">−</button><span class="wert">5</span><button class="rund">+</button>
    </div>
    <div class="stepper">
      <div class="zeile-text"><span class="zeile-name">Sätze</span><span class="klein muted"></span></div>
      <button class="rund">−</button><span class="wert">2</span><button class="rund">+</button>
    </div>
  </section>
  <section class="card zeilen">
    <div class="zeile" style="min-height: 60px">
      <div class="zeile-text"><span class="zeile-name">Eigene Zeiten</span><span class="klein muted">Satzpause 45 s</span></div>
      <span class="rund" style="background: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></span>
    </div>
    <div class="stepper">
      <div class="zeile-text"><span class="zeile-name">Absenken</span><span class="klein muted">Sekunden</span></div>
      <button class="rund">−</button><span class="wert standard">Standard<br>3 s</span><button class="rund">+</button>
    </div>
    <div class="stepper">
      <div class="zeile-text"><span class="zeile-name">Satzpause</span><span class="klein muted">Sekunden · <u>Zurücksetzen</u></span></div>
      <button class="rund">−</button><span class="wert">45</span><button class="rund">+</button>
    </div>
  </section>
  <p class="klein muted" style="margin: 0 4px">Wird verwendet in: Rücken</p>
</div>
</body>
</html>
