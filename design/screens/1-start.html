<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Start</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0; background-color: #ffffff; }
a{color:#921A5B}a:hover{color:#6E1344}
</style>
</head>
<body style="display:flex;justify-content:center;padding:24px;background:#eee">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; background: var(--ground-wash); color: var(--ink); font-family: var(--font-sans)">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-weight: 800; font-size: 18px">Übungscoach</span>
    <button aria-label="Einstellungen" style="width: 44px; height: 44px; border-radius: var(--radius-pill); border: 0; background: var(--surface); box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: center; color: var(--ink)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 15px; font-weight: 600; color: var(--muted)">Hallo Regina</span>
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.015em">Was trainierst du heute?</h1>
  </div>

  <article style="background: var(--surface); box-shadow: var(--shadow-soft); border-radius: var(--radius-lg); padding: 8px; display: flex; flex-direction: column; gap: 6px">
    <div style="border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 4px; background-color: var(--ground)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 24px; font-weight: 800">Rücken</h2>
        <span style="font-size: 15px; font-weight: 600; color: var(--muted)">ca. 8 Min</span>
      </div>
      <span style="font-size: 15px; color: var(--muted)">3 Übungen · Start: auf dem Rücken liegen</span>
    </div>
    <div style="display: flex; flex-direction: column; padding: 4px 12px">
      <div style="display: flex; justify-content: space-between; padding: 11px 0"><span style="font-weight: 600">Becken kippen</span><span style="font-variant-numeric: tabular-nums; color: var(--muted)">2 × 15</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-weight: 600">Beine seitlich kippen</span><span style="font-variant-numeric: tabular-nums; color: var(--muted)">2 × 5 je Seite</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-weight: 600">Brücke</span><span style="font-variant-numeric: tabular-nums; color: var(--muted)">2 × 10 × 5 s</span></div>
    </div>
    <button style="height: 60px; border-radius: var(--radius-pill); border: 0; background: var(--primary); color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"></path></svg>Training starten
    </button>
  </article>

  <article style="background: var(--surface); box-shadow: var(--shadow-soft); border-radius: var(--radius-lg); padding: 18px 20px; display: flex; align-items: center; gap: 14px">
    <span style="width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--tint); display: flex; align-items: center; justify-content: center; color: var(--muted)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 700; font-size: 18px">Arme mit Theraband</span>
      <span style="font-size: 14px; color: var(--muted)">Übungen noch nicht eingetragen</span>
    </div>
  </article>
</div>
</body>
</html>
