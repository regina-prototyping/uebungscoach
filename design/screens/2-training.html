<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Training</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#921A5B}a:hover{color:#6E1344}
</style>
</head>
<body style="display:flex;justify-content:center;padding:24px;background:#eee">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: var(--ground-wash); color: var(--ink); font-family: var(--font-sans)">
  <div style="display: flex; align-items: center; gap: 12px">
    <button style="border: 0; background: none; padding: 10px 0; font: inherit; font-weight: 600; color: var(--muted)">Beenden</button>
    <span style="flex: 1; text-align: center; font-weight: 700">Rücken</span>
    <span style="font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums">noch 7:12</span>
  </div>
  <div style="height: 6px; border-radius: 3px; background: var(--line); overflow: hidden"><div style="width: 12%; height: 100%; border-radius: 3px; background: var(--primary)"></div></div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em">Becken kippen</h1>
    <p style="margin: 0; color: var(--muted); font-size: 17px">Bauch einziehen</p>
    <div style="display: flex; gap: 8px; margin-top: 6px">
      <span style="padding: 5px 12px; border-radius: var(--radius-pill); background: var(--primary-soft); font-size: 14px; font-weight: 700">Übung 1 von 3</span>
      <span style="padding: 5px 12px; border-radius: var(--radius-pill); background: var(--primary-soft); font-size: 14px; font-weight: 700">Satz 1 von 2</span>
    </div>
  </div>

  <div style="flex: 1; background: var(--surface); box-shadow: var(--shadow-soft); border-radius: 32px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 300px; height: 300px">
      <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0">
        <circle cx="150" cy="150" r="130" fill="none" stroke="var(--line)" stroke-width="16"></circle>
        <circle cx="150" cy="150" r="130" fill="none" stroke="var(--primary)" stroke-width="16" stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="435.6" transform="rotate(-90 150 150)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary)">Wiederholung</span>
        <span style="font-size: 128px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">7</span>
        <span style="font-size: 18px; font-weight: 600; color: var(--muted)">von 15</span>
      </div>
    </div>
  </div>

  <div style="background: var(--surface); box-shadow: var(--shadow-soft); border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <span style="font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Danach</span>
    <span style="flex: 1; font-weight: 700">Beine seitlich kippen</span>
    <span style="color: var(--muted)">2 × 5 je Seite</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <button aria-label="Zurück" style="width: 64px; height: 64px; border-radius: var(--radius-pill); border: 0; background: var(--surface); box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: center; color: var(--ink)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"></path><path d="M19 5 9 12l10 7z"></path></svg>
    </button>
    <button style="flex: 1; height: 72px; border-radius: var(--radius-pill); border: 0; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-size: 18px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14"></path><path d="M15 5v14"></path></svg>Pause
    </button>
    <button aria-label="Nächste Übung" style="width: 64px; height: 64px; border-radius: var(--radius-pill); border: 0; background: var(--surface); box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: center; color: var(--ink)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg>
    </button>
  </div>
</div>
</body>
</html>
