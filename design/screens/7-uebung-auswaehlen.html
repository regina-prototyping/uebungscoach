<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Übung auswählen</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="bausteine.css">
</head>
<body>
<div class="frame">
  <div class="kopf">
    <h1 class="titel">Übung hinzufügen</h1>
    <button class="text-btn">Abbrechen</button>
  </div>
  <p class="muted" style="margin: -8px 0 0">Zu „Rücken“</p>
  <button class="btn-soft"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Neue Übung anlegen</button>
  <h2 class="abschnitt">Aus deinen Übungen</h2>
  <section class="card zeilen">
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left">
        <div class="zeile-text"><span class="zeile-name">Becken kippen</span><span class="klein muted zahl">2 × 15 · schon im Programm</span></div>
        <span class="rund" style="background: var(--primary-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      </button>
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left">
        <div class="zeile-text"><span class="zeile-name">Beine seitlich kippen</span><span class="klein muted zahl">2 × 5 je Seite</span></div>
        <span class="rund" style="background: var(--primary-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      </button>
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left">
        <div class="zeile-text"><span class="zeile-name">Brücke</span><span class="klein muted zahl">2 × 10 × 5 s · schon im Programm</span></div>
        <span class="rund" style="background: var(--primary-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      </button>
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left">
        <div class="zeile-text"><span class="zeile-name">Dehnung Rücken</span><span class="klein muted zahl">1 × 20 s · schon im Programm</span></div>
        <span class="rund" style="background: var(--primary-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      </button>
      <button class="zeile" style="width: 100%; border-width: 1px 0 0; border-style: solid; border-color: var(--line); background: none; text-align: left">
        <div class="zeile-text"><span class="zeile-name">Seitstütz</span><span class="klein muted zahl">2 × 3 × 10 s je Seite</span></div>
        <span class="rund" style="background: var(--primary-soft)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
      </button>
  </section>
</div>
</body>
</html>
